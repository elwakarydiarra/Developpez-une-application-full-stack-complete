<header class="topbar" [class.auth]="(isAuthPage$ | async) ?? false">
  <!-- logo toujours visible (desktop) ; clique → articles si loggé sinon welcome -->
  <a class="brand" [routerLink]="(auth.isLoggedIn$ | async) ? '/articles' : '/welcome'" aria-label="Accueil">
    <img src="assets/mdd-logo.png" alt="MDD" />
  </a>

  <!-- NAV NORMAL (pages non-auth uniquement) -->
  <ng-container *ngIf="!(isAuthPage$ | async)">
    <nav class="nav" *ngIf="auth.isLoggedIn$ | async">
      <a class="logout" (click)="logout()">Se déconnecter</a>
      <a routerLink="/articles" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Articles</a>
      <a routerLink="/themes" routerLinkActive="active">Thèmes</a>
    </nav>
    <div class="right" *ngIf="auth.isLoggedIn$ | async">
      <a class="profile" routerLink="/profile" aria-label="Profil">
        <span class="material-icons">account_circle</span>
      </a>
    </div>
  </ng-container>

  <!-- PAGES D’AUTH : rien d’autre que le logo -->
  <ng-container *ngIf="isAuthPage$ | async">
    <!-- volontairement vide : nav et profil sont masqués par le CSS -->
  </ng-container>
</header>

<router-outlet></router-outlet>
