<h2>Créer un nouvel article</h2>

<form (ngSubmit)="onSubmit()">
  <label>Thème</label>
  <select [(ngModel)]="topicId" name="topicId" required>
    <option [ngValue]="null" disabled selected>— choisir —</option>
    <option *ngFor="let t of topics; trackBy: trackById" [ngValue]="t.id">
      {{ t.name }}
    </option>
  </select>

  <label>Titre</label>
  <input [(ngModel)]="title" name="title" required placeholder="Titre de l’article" />

  <label>Contenu</label>
  <textarea [(ngModel)]="content" name="content" rows="6" required placeholder="Votre texte..."></textarea>

  <div class="actions">
    <button type="submit" [disabled]="!canSubmit()">Créer</button>
  </div>

  <p class="error" *ngIf="error">{{ error }}</p>
</form>
