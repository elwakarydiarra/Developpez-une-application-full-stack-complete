<div class="auth-page">
  <!-- flèche retour -->
  <a class="back" routerLink="/login" aria-label="Retour">
    <span class="material-icons">arrow_back</span>
  </a>

  <h1>Inscription</h1>

  <form class="form" #f="ngForm" (ngSubmit)="onSubmit()">
    <label class="label" for="username">Nom d’utilisateur</label>
    <input
      id="username"
      name="username"
      [(ngModel)]="username"
      required
      [disabled]="loading"
    />

    <label class="label" for="email">Adresse e-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      required
      [disabled]="loading"
    />

    <label class="label" for="password">Mot de passe</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      minlength="8"
      required
      [disabled]="loading"
    />

    <button class="primary" type="submit" [disabled]="loading || f.invalid">
      {{ loading ? 'En cours…' : "S’inscrire" }}
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>

    <div class="hint">
      <a routerLink="/login">Déjà inscrit ?</a>
    </div>
  </form>
</div>
