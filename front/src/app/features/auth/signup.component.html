<div class="auth-page">
  <!-- Flèche retour -->
  <a class="back" (click)="goWelcome($event)" aria-label="Retour">
    <span class="material-icons">arrow_back</span>
  </a>

  <!-- Logo au-dessus du titre -->
  <img class="logo" src="assets/mdd-logo.png" alt="MDD" />

  <h1>Inscription</h1>

  <form class="form" #f="ngForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
    <div class="field">
    <label class="label" for="username">Nom d’utilisateur</label>
    <input
      id="username"
      name="username"
      [(ngModel)]="username"
      required
      [disabled]="loading"
      autocomplete="username"
    />
    </div>
    <div class="field">
    <label class="label" for="email">Adresse e-mail</label>
    <input
      id="email"
      name="email"
      type="email"
      [(ngModel)]="email"
      required
      [disabled]="loading"
      autocomplete="email"
      inputmode="email"
    />
    </div>
    <div class="field">

    <label class="label" for="password">Mot de passe</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      minlength="8"
      required
      [disabled]="loading"
      #pw="ngModel"
      autocomplete="new-password"
      pattern="^(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z])(?=.*[^A-Za-z0-9])(?=\S+$).{8,}$"
    />
    </div>

    <!-- Messages de validation -->
    <p class="error" *ngIf="pw.invalid && pw.touched">
      <span *ngIf="pw.errors?.['required']">Mot de passe requis.</span>
      <span *ngIf="pw.errors?.['minlength']">Au moins 8&nbsp;caractères.</span>
      <span *ngIf="pw.errors?.['pattern']">
        Doit contenir une majuscule, une minuscule, un chiffre, un caractère spécial et aucun espace.
      </span>
    </p>

    <button class="primary" type="submit" [disabled]="loading || f.invalid">
      {{ loading ? 'En cours…' : "S’inscrire" }}
    </button>

    <p class="error" *ngIf="error">{{ error }}</p>
  </form>
</div>
