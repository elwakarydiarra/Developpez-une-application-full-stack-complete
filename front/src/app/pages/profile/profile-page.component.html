<div class="wrap">
  <!-- Titre -->
  <h1 class="page-title">Profil utilisateur</h1>

  <!-- Formulaire profil -->
  <form class="profile-form" (ngSubmit)="save()">
    <!-- Username -->
    <input
      class="inp"
      type="text"
      name="username"
      [(ngModel)]="username"
      placeholder="Username"
      required
    />

    <!-- Email -->
    <input
      class="inp"
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="email@email.fr"
      required
    />

    <!-- Nouveau mot de passe (optionnel) -->
    <input
      class="inp"
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Mot de passe"
    />

    <!-- Checklist force du mot de passe (affichée si l'utilisateur saisit quelque chose) -->
    <ul class="pw-rules" *ngIf="password">
      <li [class.ok]="hasMinLen">Au moins 8 caractères</li>
      <li [class.ok]="hasLower">Une lettre minuscule</li>
      <li [class.ok]="hasUpper">Une lettre majuscule</li>
      <li [class.ok]="hasDigit">Un chiffre</li>
      <li [class.ok]="hasSpecial">Un caractère spécial</li>
      <li [class.ok]="noSpace">Sans espace</li>
    </ul>

    <!-- Actions / messages -->
    <button class="primary" type="submit" [disabled]="saving || !email || !username || !pwStrong">
      {{ saving ? 'Enregistrement…' : 'Sauvegarder' }}
    </button>

    <div class="msg ok" *ngIf="infoMsg">{{ infoMsg }}</div>
    <div class="msg err" *ngIf="errorMsg">{{ errorMsg }}</div>
  </form>

  <hr class="sep" />

  <!-- Abonnements -->
  <h2 class="section-title">Abonnements</h2>

  <div class="muted" *ngIf="loadingTopics">Chargement…</div>
  <div class="muted" *ngIf="!loadingTopics && myTopics.length === 0">
    Aucun abonnement pour le moment.
  </div>

  <!-- 2 cartes par ligne -->
  <div class="topics-grid" *ngIf="!loadingTopics && myTopics.length">
    <article class="card" *ngFor="let t of myTopics; trackBy: trackById">
      <h3 class="topic-title">{{ t.name }}</h3>
      <p class="topic-desc">{{ t.description }}</p>

     <button
  class="secondary"
  (click)="unsubscribe(t)"
  [disabled]="unsubscribingId === t.id"
  [attr.aria-label]="'Se désabonner de ' + t.name"
>
  {{ unsubscribingId === t.id ? '…' : 'Se désabonner' }}
</button>
    </article>
  </div>
</div>
