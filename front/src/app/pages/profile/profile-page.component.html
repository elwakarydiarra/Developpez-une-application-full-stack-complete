<h2>Mon profil</h2>

<h3>Mes thèmes</h3>
<p *ngIf="loading">Chargement…</p>
<p class="error" *ngIf="error">{{ error }}</p>

<ul class="topics">
  <li *ngFor="let t of myTopics; trackBy: trackById">
    <span class="name">{{ t.name }}</span>
    <button (click)="unsubscribe(t)">Se désabonner</button>
  </li>
</ul>

<p *ngIf="!loading && myTopics.length === 0">Aucun thème suivi pour le moment.</p>
